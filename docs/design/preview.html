<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EpoBrowser · UI 시안</title>
<style>
:root{color-scheme:light;--bg:#f5f7f5;--panel:#fff;--ink:#172b26;--muted:#62736d;--line:#e2e9e4;--accent:#087f74;--selected:#e0f1eb}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink)}body.dark{color-scheme:dark;--bg:#101615;--panel:#19211e;--ink:#e0e5e1;--muted:#a5b8ae;--line:#2d3d34;--accent:#78d6c5;--selected:#21483c}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit;background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{transform:scale(.98)}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{padding:30px 18px;background:var(--panel);border-right:1px solid var(--line)}.brand{font-size:21px;letter-spacing:-.6px;font-weight:750}.brand b{display:inline-grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--panel);height:35px;width:35px;margin-right:8px}.sub{color:var(--muted);font-size:12px;line-height:1.6}aside .sub{margin:8px 0 30px}h3{font-size:11px;color:var(--muted);margin:25px 10px 10px;letter-spacing:1px}nav button{display:block;text-align:left;width:100%;border:0;margin:3px 0;padding:11px 14px}button.selected{background:var(--selected);color:var(--accent);font-weight:650}.sep{height:1px;background:var(--line);margin:22px 0}details{padding:10px}summary{cursor:pointer;font-weight:600}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chips button{padding:6px 10px}input[type=range]{accent-color:var(--accent);width:100%}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:16px 32px;background:var(--panel)}header input{width:min(480px,65%);padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}header span{flex:1}.main{padding:32px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}.toolbar{display:flex;align-items:center;gap:8px;margin:28px 0 20px}.toolbar select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.toolbar span{flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel);overflow:hidden}.art{aspect-ratio:16/9;border-radius:8px;position:relative;overflow:hidden;background:#b8c9b4}.art:before{content:'';position:absolute;inset:20% -20% -80%;border-radius:40%;background:#738c72;transform:rotate(-22deg)}.art:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;color:#fff8;font-size:28px}.card:nth-child(2n) .art{background:#c2c7d3}.card:nth-child(2n) .art:before{background:#8993a9}.card:nth-child(3n) .art{background:#dbccac}.card:nth-child(3n) .art:before{background:#b8a07c}.badge,.duration{position:absolute;color:white;background:#172b26aa;border-radius:4px;font-size:10px;padding:4px 6px;z-index:1}.badge{top:8px;left:8px}.duration{bottom:8px;right:8px}.card h2{font-size:14px;margin:13px 3px 8px;line-height:1.5}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:7px 3px}.note{margin-top:30px;color:var(--muted);font-size:12px}.empty{text-align:center;padding:80px 20px;grid-column:1/-1}.recent{display:flex;gap:10px;align-items:center;margin:14px 8px}.mini{width:52px;height:34px;border-radius:5px;background:#a8bbb0}.mobilemenu{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:210px 1fr}header,.main{padding:24px}}@media(max-width:650px){.shell{display:block}aside{display:none}body.menu aside{display:block}.mobilemenu{display:block}header{padding:12px;height:auto;flex-wrap:wrap}header input{flex:1;width:40%}.main{padding:22px 16px}.grid{gap:10px}.card{padding:7px}.toolbar{flex-wrap:wrap}.toolbar span{display:none}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<div class="shell"><aside><div class="brand"><b>▷</b>EpoBrowser</div><p class="sub">나만의 미디어 라이브러리</p><h3>LIBRARY · 탐색</h3><nav><button class="selected" data-title="영상 라이브러리">▦　모든 영상</button><button data-title="베스트 영상">♧　베스트 영상</button><button data-title="최고 평점">☆　최고 평점</button><button data-title="카테고리">⊞　카테고리</button><button data-title="채널">▣　채널</button></nav><div class="sep"></div><details><summary>세부 필터</summary><p class="sub">화질 · 즉시 적용</p><div class="chips" id="quality"><button class="selected">전체</button><button>1080p+</button><button>2K+</button><button>4K</button></div><p class="sub">길이</p><input type="range" min="0" max="61" value="61" aria-label="최대 길이"><p class="sub" id="length">최대 1시간 이상</p><button id="reset">초기화</button></details><h3>RECENT · 최근 본 영상</h3><div class="recent"><div class="mini"></div><div class="sub">다시 보고 싶은 순간<br>방금 전</div></div><div class="recent"><div class="mini"></div><div class="sub">저장한 컬렉션<br>어제</div></div></aside><section><header><button class="mobilemenu" aria-label="메뉴 열기" onclick="document.body.classList.toggle('menu')">☰</button><input type="search" placeholder="라이브러리 검색" aria-label="라이브러리 검색"><span></span><button id="theme">다크 모드</button></header><main class="main"><div class="eyebrow">YOUR PERSONAL LIBRARY</div><h1>영상 라이브러리</h1><div class="sub" id="count">원하는 영상을 찾고, 나만의 컬렉션을 만들어 보세요.</div><div class="toolbar"><select aria-label="정렬"><option>최신순</option><option>평점순</option></select><button id="category">전체 카테고리</button><span></span><label class="sub">카드 크기 <input id="density" type="range" min="2" max="4" value="3" style="width:80px;vertical-align:middle"></label></div><div class="grid" id="grid"></div><p class="note">UI 방향 검토용 시안 · 추상 썸네일과 예시 데이터 사용 · 실제 앱의 검색 및 재생에는 연결되지 않습니다.</p></main></section></div>
<script>
const titles=['나만의 컬렉션, 새로운 발견','다시 보고 싶은 순간','이번 주 많이 본 영상','여유롭게 둘러보는 라이브러리','좋아하는 채널의 새로운 영상','취향에 맞는 다음 영상'];let quality='전체';const grid=document.querySelector('#grid');function render(){const q=document.querySelector('input[type=search]').value;let items=titles.map((title,i)=>({title,i})).filter(x=>x.title.includes(q));if(document.querySelector('select').selectedIndex)items.reverse();grid.innerHTML=items.map(({title,i})=>`<article class="card"><div class="art"><span class="badge">${quality==='전체'?(i%2?'1080p':'4K'):quality}</span><span class="duration">${12+i*3}:24</span></div><h2>${title}</h2><div class="meta"><span>조회 ${(i+1)*12}만</span><span>☆ ${(4.9-i*.1).toFixed(1)}</span></div><div class="meta"><span>컬렉션 ${i+1}</span><span>2026.10.25</span></div></article>`).join('')||'<div class="empty"><h2>검색 결과가 없어요</h2><p class="sub">다른 검색어로 다시 찾아보세요.</p></div>';document.querySelector('#count').textContent=`${items.length}개 표시 · 영상을 선택해 재생하는 라이브러리`;}document.querySelector('input[type=search]').oninput=render;document.querySelector('select').onchange=render;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('h1').textContent=b.dataset.title;document.body.classList.remove('menu')});document.querySelector('#theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'라이트 모드':'다크 모드'};document.querySelectorAll('#quality button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#quality button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');quality=b.textContent;render()});document.querySelector('details input').oninput=e=>document.querySelector('#length').textContent=e.target.value==='61'?'최대 1시간 이상':`최대 ${e.target.value}분`;document.querySelector('#reset').onclick=()=>{document.querySelector('#quality button').click();document.querySelector('details input').value=61;document.querySelector('#length').textContent='최대 1시간 이상'};document.querySelector('#density').oninput=e=>grid.style.gridTemplateColumns=`repeat(${e.target.value},minmax(0,1fr))`;document.querySelector('#category').onclick=()=>{document.querySelector('details').open=true;document.body.classList.add('menu');document.querySelector('summary').focus()};render();
</script></html>
